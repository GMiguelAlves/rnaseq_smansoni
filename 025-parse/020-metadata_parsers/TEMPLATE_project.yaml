dataset: PRJXXXX

defaults:
  dataset: PRJXXXX
  condition: unknown
  batch: B0
  lane:

columns:
  sample_field: sample_id
  run_field: run_accession

preserve_columns:
  sample_id: raw_sample_id
  study_accession: study_accession

parsing:
  stage:
    source: sample_id
    regex_map:
      "adult": adult

  tissue:
    source: sample_id
    regex_map:
      "whole": whole_body

  sex:
    source: sample_id
    regex_map:
      "female|^F_": female
      "male|^M_": male
      "mixed|^X_": mixed

  condition:
    source: sample_id
    regex_map:
      "control": control

  replicate:
    source: sample_id
    regex_extract: "R(\\d+)"

sample_id_components:
  - SM
  - field: stage
    width: 4
  - field: tissue
    width: 4
  - field: sex
    width: 3
  - field: condition
    width: 4
  - field: replicate
    replicate: true
  - field: batch

final_columns:
  - sample_id
  - file_prefix
  - raw_sample_id
  - stage
  - tissue
  - sex
  - condition
  - replicate
  - batch
  - dataset
  - lane
  - run_accession
  - study_accession
